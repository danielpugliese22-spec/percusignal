<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Club — PercuSignal</title>
<link rel="icon" type="image/svg+xml" href="/app/favicon.svg"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0c;--bg2:#111111;--bg3:#161616;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f0ede8;--muted:#7a7671;
  --gold:#e8d5a3;--gold2:#c4a96a;
  --green:#4caf7d;--orange:#e8a03a;--red:#e85a4f;
  --font:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:1px solid var(--border);background:rgba(12,12,12,0.94);backdrop-filter:blur(10px);}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.mark{width:34px;height:34px;border:1.5px solid var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mark-bars{display:flex;align-items:flex-end;gap:2.5px;height:16px;}
.bar{background:var(--gold);border-radius:1px;width:3.5px;}
.b1{height:7px}.b2{height:12px}.b3{height:9px}.b4{height:16px}.b5{height:11px}
.logo-name{font-family:var(--font);font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.03em;line-height:1;}
.logo-sub{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;}
.admin-badge{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);padding:4px 10px;border-radius:3px;letter-spacing:.1em;text-transform:uppercase;}
main{flex:1;padding:48px;}
.page-header{margin-bottom:32px;}
.page-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px;}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--gold);}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap;}
.updated-at{font-family:var(--mono);font-size:11px;color:var(--muted);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:4px;border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text);}
.btn-outline:hover{border-color:var(--gold2);color:var(--gold2);}
.summary{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
.summary-chip{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px 18px;font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:2px;}
.chip-value{font-size:22px;font-weight:700;color:var(--text);font-family:var(--font);}
.chip-value.green{color:var(--green);}
.chip-value.orange{color:var(--orange);}
.chip-value.red{color:var(--red);}
.chip-label{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
table{width:100%;border-collapse:collapse;}
th{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg2);}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;}
.badge-active{background:rgba(76,175,125,0.12);color:var(--green);border:1px solid rgba(76,175,125,0.3);}
.badge-expired{background:rgba(232,160,58,0.12);color:var(--orange);border:1px solid rgba(232,160,58,0.3);}
.badge-never{background:rgba(122,118,113,0.12);color:var(--muted);border:1px solid rgba(122,118,113,0.2);}
.email-cell{font-family:var(--mono);font-size:12px;color:var(--muted);}
.date-cell{font-family:var(--mono);font-size:12px;color:var(--muted);}
.days-chip{font-family:var(--mono);font-size:11px;color:var(--gold);background:rgba(232,213,163,0.07);padding:2px 8px;border-radius:3px;}

/* Auth screen */
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
.auth-card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:40px;}
.auth-title{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
input[type="text"]{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:15px;padding:12px 16px;outline:none;width:100%;transition:border-color .15s;}
input[type="text"]:focus{border-color:rgba(232,213,163,0.4);}
.btn-primary{background:var(--gold2);color:#0c0c0c;width:100%;justify-content:center;padding:13px;}
.btn-primary:hover{opacity:.85;}
.error-msg{font-family:var(--mono);font-size:12px;color:var(--red);margin-top:8px;display:none;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:var(--gold2);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--border);padding:24px 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.foot-copy{font-family:var(--mono);font-size:11px;color:var(--muted);}
@media(max-width:768px){
  nav{padding:14px 20px;}
  main{padding:24px 20px;}
  .summary{gap:10px;}
  table{display:block;overflow-x:auto;}
  footer{padding:24px 20px;}
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">
    <div class="mark">
      <div class="mark-bars">
        <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div>
        <div class="bar b4"></div><div class="bar b5"></div>
      </div>
    </div>
    <div>
      <div class="logo-name">PercuSignal</div>
      <div class="logo-sub">Rhythm Tools</div>
    </div>
  </a>
  <span class="admin-badge">Panel Admin</span>
</nav>

<!-- Auth screen (se oculta al autenticar) -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Acceso admin</div>
    <div class="auth-sub">Ingresá la clave para ver el panel del club.</div>
    <div class="form-group">
      <label for="secret-input">Clave de acceso</label>
      <input type="text" id="secret-input" placeholder="Ingresá la clave" autocomplete="off"/>
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    <div class="error-msg" id="auth-error">Acceso no autorizado.</div>
  </div>
</div>

<!-- Panel principal (oculto hasta autenticar) -->
<main id="main-panel" style="display:none">
  <div class="page-header">
    <div class="page-label">Admin · Club</div>
    <h1 id="panel-club-name">Cargando...</h1>
  </div>

  <div class="toolbar">
    <span class="updated-at" id="updated-at">—</span>
    <button class="btn btn-outline" onclick="loadMembers()">↻ Actualizar</button>
    <button class="btn btn-outline" onclick="doLogout()">Cerrar sesión</button>
  </div>

  <div class="summary" id="summary">
    <div class="summary-chip"><span class="chip-value green" id="count-active">—</span><span class="chip-label">Al día</span></div>
    <div class="summary-chip"><span class="chip-value orange" id="count-expired">—</span><span class="chip-label">Vencidos</span></div>
    <div class="summary-chip"><span class="chip-value red" id="count-never">—</span><span class="chip-label">Sin pago</span></div>
    <div class="summary-chip"><span class="chip-value" id="count-total">—</span><span class="chip-label">Total</span></div>
  </div>

  <div style="overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:6px;">
    <table id="members-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Estado</th>
          <th>Vence</th>
          <th>Último pago</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5" style="color:var(--muted);font-family:var(--mono);font-size:12px;text-align:center;padding:32px;">Cargando miembros...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  <span class="foot-copy">© 2026 PercuSignal · Buenos Aires 🇦🇷</span>
</footer>

<script>
const clubId = location.pathname.split('/').filter(Boolean)[2] || 'qlpm';
const STORAGE_KEY = 'ps_admin_key_' + clubId;
let adminKey = '';

const CLUB_NAMES = { qlpm: 'Qué le pasa a María?' };

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDatetime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('es-AR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function doLogin() {
  const key = document.getElementById('secret-input').value.trim();
  if (!key) return;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  const r = await fetch(`/api/get-club-members?club_id=${encodeURIComponent(clubId)}`, {
    headers: { 'x-admin-key': key }
  });
  if (r.status === 401) { err.style.display = ''; return; }
  adminKey = key;
  sessionStorage.setItem(STORAGE_KEY, key);
  const data = await r.json();
  showPanel(data);
}

function doLogout() {
  sessionStorage.removeItem(STORAGE_KEY);
  adminKey = '';
  document.getElementById('secret-input').value = '';
  document.getElementById('main-panel').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

async function loadMembers() {
  if (!adminKey) return;
  const r = await fetch(`/api/get-club-members?club_id=${encodeURIComponent(clubId)}`, {
    headers: { 'x-admin-key': adminKey }
  });
  if (r.status === 401) { doLogout(); return; }
  const data = await r.json();
  renderTable(data.members || []);
  document.getElementById('updated-at').textContent =
    'Actualizado: ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

function showPanel(data) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-panel').style.display = '';
  document.getElementById('panel-club-name').textContent = CLUB_NAMES[clubId] || clubId;
  document.getElementById('updated-at').textContent =
    'Actualizado: ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  renderTable(data.members || []);
}

function renderTable(members) {
  let active = 0, expired = 0, never = 0;
  const rows = members.map(m => {
    let badge = '';
    if (m.status === 'active') { active++; badge = `<span class="status-badge badge-active">✅ Al día</span>`; }
    else if (m.status === 'expired') { expired++; badge = `<span class="status-badge badge-expired">⚠️ Vencido</span>`; }
    else { never++; badge = `<span class="status-badge badge-never">⭕ Sin pago</span>`; }

    const daysCell = m.status === 'active'
      ? `<span class="days-chip">${m.days_left}d</span>`
      : '';

    return `<tr>
      <td>${m.display_name || '<span style="color:var(--muted)">—</span>'}</td>
      <td class="email-cell">${m.email}</td>
      <td>${badge} ${daysCell}</td>
      <td class="date-cell">${formatDate(m.active_until)}</td>
      <td class="date-cell">${m.mp_subscription_id ? formatDate(m.updated_at) : '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('table-body').innerHTML = rows ||
    '<tr><td colspan="5" style="color:var(--muted);font-family:var(--mono);font-size:12px;text-align:center;padding:32px;">Sin miembros registrados.</td></tr>';

  document.getElementById('count-active').textContent = active;
  document.getElementById('count-expired').textContent = expired;
  document.getElementById('count-never').textContent = never;
  document.getElementById('count-total').textContent = members.length;
}

// Auto-login si hay clave guardada en sesión
document.getElementById('secret-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

const savedKey = sessionStorage.getItem(STORAGE_KEY);
if (savedKey) {
  adminKey = savedKey;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-panel').style.display = '';
  document.getElementById('panel-club-name').textContent = CLUB_NAMES[clubId] || clubId;
  loadMembers();
}
</script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
